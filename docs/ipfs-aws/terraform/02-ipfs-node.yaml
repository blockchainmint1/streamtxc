AWSTemplateFormatVersion: "2010-09-09"
Description: Single-node Kubo (go-ipfs) on EC2 with public swarm + gateway

Parameters:
  VpcId:          { Type: AWS::EC2::VPC::Id }
  PublicSubnetId: { Type: AWS::EC2::Subnet::Id }
  InstanceType:   { Type: String, Default: t3.medium }

Resources:
  IpfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IPFS node
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # libp2p swarm — needed for public DHT / pinata pinByHash
        - IpProtocol: tcp
          FromPort: 4001
          ToPort: 4001
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 4001
          ToPort: 4001
          CidrIp: 0.0.0.0/0
        # public gateway (HLS playback). Put a CloudFront/ALB in front later for TLS.
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        # API port 5001 — locked to self-SG only; Lambda SG is added later via 03-lambda.yaml
        - IpProtocol: tcp
          FromPort: 5001
          ToPort: 5001
          CidrIp: 127.0.0.1/32
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  IpfsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  IpfsProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref IpfsRole] }

  IpfsVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: 200
      VolumeType: gp3
      Tags: [{ Key: Name, Value: ipfs-data }]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds: [!Ref IpfsSg]
      IamInstanceProfile: !Ref IpfsProfile
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 20, VolumeType: gp3 }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          apt-get update
          apt-get install -y wget tar

          # mount data volume (attached separately below; wait for it)
          while [ ! -e /dev/nvme1n1 ]; do sleep 2; done
          if ! blkid /dev/nvme1n1; then mkfs.ext4 /dev/nvme1n1; fi
          mkdir -p /var/lib/ipfs
          mount /dev/nvme1n1 /var/lib/ipfs
          echo "/dev/nvme1n1 /var/lib/ipfs ext4 defaults,nofail 0 2" >> /etc/fstab

          # install kubo
          cd /tmp
          wget -q https://dist.ipfs.tech/kubo/v0.30.0/kubo_v0.30.0_linux-amd64.tar.gz
          tar -xzf kubo_v0.30.0_linux-amd64.tar.gz
          bash kubo/install.sh

          # ipfs user
          useradd -r -m -d /var/lib/ipfs -s /bin/bash ipfs || true
          chown -R ipfs:ipfs /var/lib/ipfs

          # init repo as ipfs user
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs init --profile=server

          # bind API to private IP so Lambda in same VPC can reach it
          PRIVATE_IP=$(ec2-metadata -o | awk '{print $2}')
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config Addresses.API "/ip4/0.0.0.0/tcp/5001"
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config Addresses.Gateway "/ip4/0.0.0.0/tcp/8080"
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '["*"]'
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '["GET","POST","PUT","OPTIONS"]'
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config --json Gateway.HTTPHeaders.Access-Control-Allow-Origin '["*"]'
          # raise datastore limits for large files
          sudo -u ipfs IPFS_PATH=/var/lib/ipfs ipfs config Datastore.StorageMax "180GB"

          cat >/etc/systemd/system/ipfs.service <<EOF
          [Unit]
          Description=IPFS daemon
          After=network.target

          [Service]
          User=ipfs
          Environment=IPFS_PATH=/var/lib/ipfs
          ExecStart=/usr/local/bin/ipfs daemon --migrate=true
          Restart=always
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now ipfs
      Tags: [{ Key: Name, Value: txc-ipfs-node }]

  VolumeAttach:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref IpfsVolume

Outputs:
  InstanceId:      { Value: !Ref Instance }
  PrivateIp:       { Value: !GetAtt Instance.PrivateIp }
  PublicDns:       { Value: !GetAtt Instance.PublicDnsName }
  SecurityGroupId: { Value: !Ref IpfsSg }